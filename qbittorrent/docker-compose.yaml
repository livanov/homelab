services:
  qbittorrent:
    image: linuxserver/qbittorrent:5.1.2
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
      - WEBUI_PORT=8080
    volumes:
      - type: bind # using the long syntax to fail container start if source is missing
        source: ./data/config/
        target: /config/
      - type: bind # using the long syntax to fail container start if source is missing
        source: ${QBITTORRENT_DATA_DIR:-./data/downloads}
        target: /data/
    ports:
      - 6881:6881
      - 6881:6881/udp
