name: homelab

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.8-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

  qbittorrent:
    extends:
      file: ./qbittorrent/docker-compose.yaml
      service: qbittorrent
    environment:
      VIRTUAL_HOST: "torrent.lan"
      VIRTUAL_PORT: "8080"

  plex:
    extends:
      file: ./plex/docker-compose.yaml
      service: plex
    environment:
      VIRTUAL_HOST: "plex.lan"
      VIRTUAL_PORT: "32400"

  speedtest:
    extends:
      file: ./speedtest/docker-compose.yaml
      service: speedtest
    environment:
      VIRTUAL_HOST: "speedtest.lan"
      VIRTUAL_PORT: "80"

  jellyfin:
    extends:
      file: ./jellyfin/docker-compose.yaml
      service: jellyfin
    environment:
      VIRTUAL_HOST: "jellyfin.lan"
      VIRTUAL_PORT: "8096"

  ollama:
    extends:
      file: ./ollama/docker-compose.yaml
      service: ollama
    environment:
      VIRTUAL_HOST: "ollama.lan"
      VIRTUAL_PORT: "11434"
