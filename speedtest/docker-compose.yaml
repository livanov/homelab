services:
  speedtest:
    image: lscr.io/linuxserver/speedtest-tracker:1.8.0
    container_name: speedtest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - APP_URL=
      - SPEEDTEST_SCHEDULE="*/5 * * * *"
      # - SPEEDTEST_SERVERS=48776
      - SPEEDTEST_SERVERS=
      - DB_CONNECTION=sqlite
      # - DB_HOST= #optional
      # - DB_PORT= #optional
      # - DB_DATABASE= #optional
      # - DB_USERNAME= #optional
      # - DB_PASSWORD= #optional
      - DISPLAY_TIMEZONE=Europe/Sofia #optional
      - PRUNE_RESULTS_OLDER_THAN=10000 #optional
      # - APP_DEBUG=true
    volumes:
      - ./data/:/config
    restart: unless-stopped
