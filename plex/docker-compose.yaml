services:
  plex:
    image: ghcr.io/linuxserver/plex:1.43.2
    container_name: plex
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - UMASK=022 #optional
      - PLEX_PREF_allowedNetworks=${PLEX_ALLOWED_NETWORKS:-}
      - PLEX_PREF_customConnections=${PLEX_CUSTOM_CONNECTIONS:-}
      - PLEX_PREF_FriendlyName=${PLEX_FRIENDLY_NAME:-}
      - PLEX_PREF_RelayEnabled=0
      - PLEX_PREF_DlnaEnabled=0
    ports:
      - 32400:32400
      - 1900:1900/udp
      - 3005:3005
      - 5353/udp
      - 8324:8324
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
      - 32469:32469
    volumes:
      - type: bind # using the long syntax to fail container start if source is missing
        source: ./data/config/
        target: /config/
      - type: bind # using the long syntax to fail container start if source is missing
        source: ./custom-cont-init.d/
        target: /custom-cont-init.d/
        read_only: true
      - type: bind # using the long syntax to fail container start if source is missing
        source: ${PLEX_TVSHOWS_DIR:-./data/tvshows}
        target: /tv/
      - type: bind # using the long syntax to fail container start if source is missing
        source: ${PLEX_MOVIES_DIR:-./data/movies}
        target: /movies/
      - type: bind # using the long syntax to fail container start if source is missing
        source: ${PLEX_KIDS_TVSHOWS_DIR:-./data/tvshows}
        target: /kids_tv/
      - type: bind # using the long syntax to fail container start if source is missing
        source: ${PLEX_KIDS_MOVIES_DIR:-./data/movies}
        target: /kids_movies/
